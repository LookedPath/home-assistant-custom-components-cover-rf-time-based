set_known_position:
  name: Set known position
  description: Update the estimated position from an external observation without sending motor commands.
  target:
    entity:
      domain: cover
      integration: cover_rf_time_based
  fields:
    position:
      name: Position
      description: Position between 0 (closed) and 100 (fully open).
      required: true
      example: 50
      selector:
        number:
          min: 0
          max: 100
          step: 1
    confident:
      name: Confident
      description: An external sensor has confirmed this position.
      default: false
      selector:
        boolean:
    position_type:
      name: Position type
      description: Target simulates travel; current corrects the position immediately, preserving the target if moving.
      default: target
      selector:
        select:
          options:
            - target
            - current
set_known_action:
  name: Set known action
  description: Observe an external open, close or stop command without sending motor commands.
  target:
    entity:
      domain: cover
      integration: cover_rf_time_based
  fields:
    action:
      name: Action
      required: true
      example: open
      selector:
        select:
          options:
            - open
            - close
            - stop
